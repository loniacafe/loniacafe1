        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .top-bar { display: flex; justify-content: flex-end; margin-bottom: 8px; }
        .icon-btn {
            background: var(--surface); border: 1px solid var(--border); color: var(--cream); width: 42px; height: 42px;
            border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer;
            font-size: 17px; transition: 0.3s; box-shadow: 0 4px 12px var(--shadow);
        }

        header { text-align: center; margin-bottom: 22px; }
        .tagline { color: var(--cream-dim); font-size: 13.5px; font-weight: 300; }

        .search-container { position: relative; margin-bottom: 18px; }
        .search-container input {
            width: 100%; background: var(--surface); border: 1px solid var(--border); padding: 13px 44px 13px 18px;
            border-radius: 16px; color: var(--cream); font-size: 14px; outline: none; backdrop-filter: blur(10px); transition: 0.3s;
        }
        .search-container i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: var(--cream-dim); }

        .categories-scroll { overflow-x: auto; white-space: nowrap; padding-bottom: 8px; margin-bottom: 20px; scrollbar-width: none; }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .category-btn {
            background: var(--surface); color: var(--cream-dim); border: 1px solid var(--border); padding: 8px 18px;
            border-radius: 25px; font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px;

        .menu-list { display: grid; gap: 14px; }
        .menu-card {
            background: var(--surface); border: 1px solid var(--border); backdrop-filter: blur(12px); border-radius: 18px;
            padding: 12px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: 0.3s ease;

        .menu-img { width: 80px; height: 80px; border-radius: 14px; object-fit: cover; border: 1px solid var(--border); flex-shrink: 0; }
        .menu-info { flex-grow: 1; }
        .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
        .menu-title { font-size: 15.5px; font-weight: 700; }
        .badge { background: var(--burgundy-light); color: #fbf5e2; font-size: 10px; padding: 2px 7px; border-radius: 6px; }
        .menu-desc { font-size: 12px; color: var(--cream-dim); margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-price { font-size: 14.5px; font-weight: 800; color: var(--cream); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.82); backdrop-filter: blur(10px); z-index: 1000; display: none; align-items: flex-end; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--modal-bg); border: 1px solid var(--border); width: 100%; max-width: 500px; border-radius: 28px 28px 0 0; padding: 24px; position: relative; max-height: 90vh; overflow-y: auto; }
        .modal-close { position: absolute; left: 20px; top: 20px; background: var(--surface); border: 1px solid var(--border); width: 38px; height: 38px; border-radius: 50%; color: var(--cream); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; }

        .settings-card { background: var(--surface); border-radius: 16px; padding: 16px; border: 1px solid var(--border); margin-top: 15px; }

        .lang-options { display: flex; gap: 6px; }

        footer { text-align: center; margin-top: 35px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--cream-dim); font-size: 12px; }
    </style>
</head>

            { id: 'item_10', order: 10, category: 'mojito', price: '4,500 IQD', badge: { ku: 'پڕفرۆشترین', en: 'Best Seller', ar: 'الأكثر طلباً' }, title: { ku: 'Passion Fruit Mojito', en: 'Passion Fruit Mojito', ar: 'موهيتو باشن فروت' }, desc: { ku: 'میوەیا پاسیۆن فروت، لۆمی، نەعنەع و ئاڤا گازدار.', en: 'Exotic passion fruit puree with mint and sparkling soda.', ar: 'مزيج فاكهة الباشن فروت الاستوائية مع الليمون والصودا.' }, img: 'https://images.unsplash.com/photo-1544145945-f90425340c7e?w=600&h=600&fit=crop&q=80' },
            { id: 'item_11', order: 11, category: 'mojito', price: '4,500 IQD', badge: null, title: { ku: 'Strawberry Mojito', en: 'Strawberry Mojito', ar: 'موهيتو فراولة' }, desc: { ku: 'فڕاولا فرێش، نەعنەع و لۆمی دگەل بەفرا هویر.', en: 'Crushed sweet strawberries, mint leaves, and lime soda.', ar: 'فراولة طبيعية مع النعناع المنعش وعصير الليمون.' }, img: 'https://images.unsplash.com/photo-1506802913710-40e2e66339c9?w=600&h=600&fit=crop&q=80' },
            { id: 'item_12', order: 12, category: 'dessert', price: '6,000 IQD', badge: { ku: 'شاهانە', en: 'Signature', ar: 'فاخر' }, title: { ku: 'San Sebastian Cheesecake', en: 'San Sebastian Cheesecake', ar: 'سان سيباستيان تشيز كيك' }, desc: { ku: 'دگەل سۆسا چوکلێتا بلژیکی یا گەرم پێشکێش دبیت.', en: 'Creamy burnt cheesecake served with warm Belgian chocolate.', ar: 'تشيز كيك كريمي محروق يقدم مع الشوكولاتة البلجيكية الساخنة.' }, img: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=600&h=600&fit=crop&q=80' },
            { id: 'item_13', order: 13, category: 'dessert', price: '5,500 IQD', badge: { ku: 'ئیتالی', en: 'Italian Classic', ar: 'إيطالي' }, title: { ku: 'Classic Tiramisù', en: 'Classic Tiramisù', ar: 'تيراميسو كلاسيك' }, desc: { ku: 'تیرامیسوویا ڕەسەن یا ئیتالی ب کرێما ماسکارپۆنی و قەهوا Ionia.', en: 'Authentic Italian tiramisu with mascarpone and espresso.', ar: 'حلوى التيراميسو الإيطالية الأصلية بكريمة الماسكاربوني الفاخرة.' }, img: 'https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?w=600&h=600&fit=crop&q=80' },
            { id: 'item_14', order: 14, category: 'dessert', price: '5,000 IQD', badge: null, title: { ku: 'Chocolate Lava Cake', en: 'Chocolate Lava Cake', ar: 'مولتن شوكولاتة كيك' }, desc: { ku: 'کێکێ شوکولاتێ یێ کەل دگەل ئایسکرێما ڤانێلا.', en: 'Warm chocolate cake with a molten center & vanilla gelato.', ar: 'كيك الشوكولاتة الساخن بالقلب الذائب مع آيس كريم الفانيلا.' }, img: 'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?w=600&h=600&fit=crop&q=80' },
            { id: 'item_15', order: 15, category: 'dessert', price: '3,500 IQD', badge: { ku: 'فرێش', en: 'Fresh', ar: 'طازج' }, title: { ku: 'French Croissant Nutella', en: 'French Nutella Croissant', ar: 'كرواسان نوتيلا فرنسي' }, desc: { ku: 'کرواسانا فرەنسی یا نازک پڕ ژ شوکولاتێ نۆتێلا یا خۆش.', en: 'Flaky butter croissant filled with delicious rich Nutella.', ar: 'كرواسان زبدة فرنسي هش ومقرمش محشو بكريمة النوتيلا.' }, img: 'https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=600&h=600&fit=crop&q=80' }
        ];

        let categories = defaultCategories;
        let products = sampleProducts;
        let siteSettings = {
            tagline: { ku: "قەهوا ئەسلا ئیتالی ب تامەکا تایبەت", en: "The Authentic Italian Coffee Experience", ar: "القهوة الإيطالية الأصيلة بمذاق فريد" },
            announcement: "بخێرهاتن بۆ ionia coffee • دەمەکێ خۆش بۆ هەوە دخواازین"
        };

        let currentLang = 'ku';
        let currentCategory = 'all';

        const uiText = {
            ku: { search: "ل ناڤێ قەهوێ یان شریناهیێ بگەرە...", catAll: "هەمی", settings: "ڕێکخستن", lang: "زمان / Language", theme: "ڕوخسار (Theme)", devTag: "دیزاین و بەرهەمهێنەر", price: "بها:" },
            en: { search: "Search coffee or sweets...", catAll: "All", settings: "Settings", lang: "Language", theme: "Theme", devTag: "Designed & Produced by", price: "Price:" },
            ar: { search: "ابحث عن مشروب أو حلوى...", catAll: "الكل", settings: "الإعدادات", lang: "اللغة", theme: "المظهر", devTag: "تصميم وإنتاج", price: "السعر:" }
        };

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                splash.style.opacity = '0';
                setTimeout(() => splash.style.display = 'none', 700);
            }, 1200);

            // نیشاندانا دەستپێکێ ب داتایێن نموونەیی دا چ جاران بەتال نەمینیت
            renderCategories();
            renderMenu();

            // چاڤدێرییا زیندی یا فایربەیس
            rtdb.ref('settings/header').on('value', snapshot => {
                if (snapshot.exists()) {
                    siteSettings = snapshot.val();
                    applyHeaderSettings();
                }
            });

            rtdb.ref('settings/categories').on('value', snapshot => {
                if (snapshot.exists() && snapshot.val()) {
                    categories = snapshot.val();
                    renderCategories();
                }
            });

            rtdb.ref('menu_items').on('value', snapshot => {
                if (snapshot.exists() && snapshot.val()) {
                    const data = snapshot.val();
                    products = Object.values(data).sort((a,b) => (a.order || 0) - (b.order || 0));
                    renderMenu();
                }
            });
        });

        function applyHeaderSettings() {
            document.getElementById('taglineText').innerText = siteSettings.tagline[currentLang] || siteSettings.tagline.ku;
            document.getElementById('announcementText').innerText = siteSettings.announcement || '';
        }

        function renderCategories() {
            const bar = document.getElementById('categoriesBar');
            bar.innerHTML = `
                <button class="category-btn ${currentCategory === 'all' ? 'active' : ''}" onclick="filterCategory('all', this)">
                    <i class="fa-solid fa-mug-saucer"></i> ${uiText[currentLang].catAll}
                </button>
            `;
            categories.forEach(cat => {
                const title = cat.title[currentLang] || cat.title.ku;
                const icon = cat.icon || 'fa-tag';
                const btn = document.createElement('button');
                btn.className = `category-btn ${currentCategory === cat.id ? 'active' : ''}`;
                btn.onclick = () => filterCategory(cat.id, btn);
                btn.innerHTML = `<i class="fa-solid ${icon}"></i> ${title}`;
                bar.appendChild(btn);
            });
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const query = document.getElementById('searchInput').value.toLowerCase();
            container.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesCat = currentCategory === 'all' || p.category === currentCategory;
                const matchesSearch = (p.title[currentLang] || p.title.ku).toLowerCase().includes(query) || 
                                      (p.desc[currentLang] || p.desc.ku).toLowerCase().includes(query);
                return matchesCat && matchesSearch;
            });

            filtered.forEach(p => {
                const title = p.title[currentLang] || p.title.ku;
                const desc = p.desc[currentLang] || p.desc.ku;
                const badge = p.badge ? (p.badge[currentLang] || p.badge.ku || '') : '';

                const card = document.createElement('div');
                card.className = 'menu-card fade-in';
                card.onclick = () => openItemDetail(p);
                card.innerHTML = `
                    <img src="${p.img}" class="menu-img" alt="${title}" onerror="this.src='https://via.placeholder.com/80?text=1:1'">
                    <div class="menu-info">
                        <div class="menu-header">
                            <span class="menu-title">${title}</span>
                            ${badge ? `<span class="badge">${badge}</span>` : ''}
                        </div>
                        <p class="menu-desc">${desc}</p>
                        <div class="menu-price">${p.price}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderMenu();
        }

        document.getElementById('searchInput').addEventListener('input', renderMenu);

        function openItemDetail(item) {
            document.getElementById('detailImg').src = item.img;
            document.getElementById('detailTitle').innerText = item.title[currentLang] || item.title.ku;
            const badge = item.badge ? (item.badge[currentLang] || item.badge.ku || '') : '';
            document.getElementById('detailBadge').innerText = badge;
            document.getElementById('detailBadge').style.display = badge ? 'inline-block' : 'none';
            document.getElementById('detailDesc').innerText = item.desc[currentLang] || item.desc.ku;
            document.getElementById('detailPrice').innerText = item.price;
            openModal('itemModal');
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function closeModalOnBg(e, id) { if(e.target.id === id) closeModal(id); }

        function setLanguage(lang) {
            currentLang = lang;
            document.documentElement.dir = (lang === 'en') ? 'ltr' : 'rtl';
            document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');

            const t = uiText[lang];
            document.getElementById('searchInput').placeholder = t.search;
            document.getElementById('settingsTitle').innerText = t.settings;
            document.getElementById('langLabel').innerText = t.lang;
            document.getElementById('themeLabel').innerText = t.theme;
            document.getElementById('devTag').innerText = t.devTag;
            document.getElementById('priceLabel').innerText = t.price;

            applyHeaderSettings();
            renderCategories();
            renderMenu();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const icon = document.querySelector('#themeToggleBtn i');
            icon.className = document.body.classList.contains('light-theme') ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }
    </script>
</body>
</html>
